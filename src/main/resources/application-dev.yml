spring:
  datasource:
    url: jdbc:h2:mem:nandhadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

app:
  firebase:
    enabled: true
    credentials-file: firebase-service-account.json

logging:
  level:
    com.company.app: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
