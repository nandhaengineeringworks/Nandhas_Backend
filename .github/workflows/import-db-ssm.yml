name: Import SQL Dump to RDS via EC2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-db:
    name: Import Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Upload SQL dump to S3
        run: |
          aws s3 cp nandhas-rds-migration.sql s3://${{ secrets.AWS_S3_BUCKET }}/nandhas-rds-migration.sql

      - name: Execute SQL on EC2 via SSM
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # Generate script to run on EC2
          cat << 'EOF' > /tmp/import_script.sh
          set -euo pipefail
          echo "Downloading SQL dump from S3..."
          aws s3 cp "s3://${AWS_S3_BUCKET}/nandhas-rds-migration.sql" /tmp/nandhas-rds-migration.sql
          
          # Convert UTF-16 LE to UTF-8 if necessary
          if file /tmp/nandhas-rds-migration.sql | grep -qi "UTF-16"; then
            echo "Converting UTF-16 to UTF-8..."
            iconv -f UTF-16LE -t UTF-8 /tmp/nandhas-rds-migration.sql > /tmp/converted.sql
            mv /tmp/converted.sql /tmp/nandhas-rds-migration.sql
          fi

          echo "Executing SQL against RDS..."
          mysql -h "${DB_HOST}" -P "${DB_PORT}" -u "${DB_USERNAME}" -p"${DB_PASSWORD}" "${DB_NAME}" < /tmp/nandhas-rds-migration.sql
          
          echo "Import complete! Removing temporary file..."
          rm /tmp/nandhas-rds-migration.sql
          EOF

          # Base64 encode the script and commands (same logic as our deploy script)
          SCRIPT_B64=$(base64 -w 0 /tmp/import_script.sh)
          
          COMMANDS=$(cat <<EOF
          [
            "printf \"%s\" ${SCRIPT_B64} | base64 -d > /tmp/nandhas-import.sh",
            "chmod 700 /tmp/nandhas-import.sh",
            "export DB_HOST=\"${DB_HOST}\"",
            "export DB_PORT=\"${DB_PORT}\"",
            "export DB_USERNAME=\"${DB_USERNAME}\"",
            "export DB_PASSWORD=\"${DB_PASSWORD}\"",
            "export DB_NAME=\"${DB_NAME}\"",
            "export AWS_S3_BUCKET=\"${AWS_S3_BUCKET}\"",
            "bash /tmp/nandhas-import.sh"
          ]
          EOF
          )

          echo "Sending SSM command to EC2..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=${COMMANDS}" \
            --timeout-seconds 1200 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId: ${COMMAND_ID}"
          
          echo "Waiting for command to complete..."
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text)
            
            echo "Status: ${STATUS}"
            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "Final Status: ${STATUS}"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query "StandardOutputContent" \
                --output text || true
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query "StandardErrorContent" \
                --output text || true
              
              if [ "$STATUS" != "Success" ]; then
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          
          echo "Timed out waiting for SSM command."
          exit 1
