name: Setup Nginx Reverse Proxy on EC2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-nginx:
    name: Setup Nginx
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Send SSM Command to configure Nginx
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          
          # Nginx setup script to run on EC2
          SCRIPT=$(cat << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          
          echo "Updating packages..."
          sudo yum update -y
          
          echo "Installing Nginx..."
          sudo yum install -y nginx
          
          echo "Writing Nginx configuration..."
          cat << 'NGINX' | sudo tee /etc/nginx/conf.d/nandhas-api.conf
          server {
              listen 80;
              server_name _;
              
              # Proxy all traffic to the Spring Boot backend
              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX
          
          echo "Restarting Nginx..."
          sudo systemctl enable nginx
          sudo systemctl restart nginx
          echo "Nginx configured successfully!"
          EOF
          )
          
          # Base64 encode the script
          SCRIPT_B64=$(echo "$SCRIPT" | base64 -w 0)
          
          # Send via SSM
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "setup-nginx" \
            --parameters '{"commands":["echo \"'$SCRIPT_B64'\" | base64 -d | sudo bash"]}' \
            --query "Command.CommandId" \
            --output text)
            
          echo "Sent SSM Command: $CMD_ID"
          
          # Poll for completion
          for i in {1..20}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text || echo "Pending")
            
            echo "Status: $STATUS"
            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              break
            fi
            sleep 5
          done
          
          echo "--- STDOUT ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "--- STDERR ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query "StandardErrorContent" --output text
          
          if [[ "$STATUS" != "Success" ]]; then
            exit 1
          fi
