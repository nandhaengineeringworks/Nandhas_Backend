name: Setup Nginx Reverse Proxy on EC2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-nginx:
    name: Setup Nginx
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Send SSM Command to configure Nginx
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          
          SCRIPT=$(cat << 'EOF'
          #!/usr/bin/env bash
          
          # 1. Update Nginx Configuration to explicitly specify the server_name for Certbot
          cat << 'NGINX' | sudo tee /etc/nginx/conf.d/nandhas-api.conf
          server {
              listen 80;
              server_name api.nandhas.in;

              # Increase body size limit for media/file uploads (must match Spring's max-request-size)
              client_max_body_size 60M;

              location / {
                  # Handle CORS preflight (OPTIONS) requests quickly without hitting Spring Boot
                  if ($request_method = 'OPTIONS') {
                      add_header 'Access-Control-Allow-Origin'  $http_origin always;
                      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin, Access-Control-Request-Method, Access-Control-Request-Headers' always;
                      add_header 'Access-Control-Allow-Credentials' 'true' always;
                      add_header 'Access-Control-Max-Age' 3600 always;
                      add_header 'Content-Length' 0;
                      add_header 'Content-Type' 'text/plain charset=UTF-8';
                      return 204;
                  }

                  proxy_pass http://127.0.0.1:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  # Pass CORS headers from Spring Boot through to the browser
                  proxy_pass_header Access-Control-Allow-Origin;
                  proxy_pass_header Access-Control-Allow-Credentials;
                  proxy_pass_header Access-Control-Allow-Methods;
                  proxy_pass_header Access-Control-Allow-Headers;

                  # Increase timeouts for large file uploads
                  proxy_connect_timeout 60s;
                  proxy_send_timeout    120s;
                  proxy_read_timeout    120s;
              }
          }
          NGINX
          sudo systemctl restart nginx
          
          # 2. Install Certbot on Amazon Linux 2023 via Python venv
          sudo dnf install -y python3 augeas-libs
          sudo python3 -m venv /opt/certbot/
          sudo /opt/certbot/bin/pip install --upgrade pip
          sudo /opt/certbot/bin/pip install certbot certbot-nginx
          sudo ln -sf /opt/certbot/bin/certbot /usr/bin/certbot
          
          # 3. Run Certbot automatically
          sudo certbot --nginx -d api.nandhas.in --non-interactive --agree-tos -m admin@nandhas.in --redirect
          EOF
          )
          
          # Base64 encode the script
          SCRIPT_B64=$(echo "$SCRIPT" | base64 -w 0)
          
          # Send via SSM
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "setup-nginx" \
            --parameters '{"commands":["echo \"'$SCRIPT_B64'\" | base64 -d | sudo bash"]}' \
            --query "Command.CommandId" \
            --output text)
            
          echo "Sent SSM Command: $CMD_ID"
          
          # Poll for completion
          for i in {1..20}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text || echo "Pending")
            
            echo "Status: $STATUS"
            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              break
            fi
            sleep 5
          done
          
          echo "--- STDOUT ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "--- STDERR ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query "StandardErrorContent" --output text
          
          if [[ "$STATUS" != "Success" ]]; then
            exit 1
          fi
