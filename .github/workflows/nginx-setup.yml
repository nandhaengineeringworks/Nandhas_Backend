name: Setup Nginx Reverse Proxy on EC2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-nginx:
    name: Setup Nginx
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Send SSM Command to configure Nginx
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          
          # Nginx setup script to run on EC2
          SCRIPT=$(cat << 'EOF'
          #!/usr/bin/env bash
          echo "=== DOCKER PS ==="
          sudo docker ps
          echo "=== CURL LOCALHOST ==="
          curl -v http://127.0.0.1:8080/api/health || true
          echo "=== NGINX ERROR LOG ==="
          sudo tail -n 50 /var/log/nginx/error.log
          echo "=== SELINUX STATUS ==="
          sestatus || echo "sestatus not found"
          EOF
          )
          
          # Base64 encode the script
          SCRIPT_B64=$(echo "$SCRIPT" | base64 -w 0)
          
          # Send via SSM
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "setup-nginx" \
            --parameters '{"commands":["echo \"'$SCRIPT_B64'\" | base64 -d | sudo bash"]}' \
            --query "Command.CommandId" \
            --output text)
            
          echo "Sent SSM Command: $CMD_ID"
          
          # Poll for completion
          for i in {1..20}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text || echo "Pending")
            
            echo "Status: $STATUS"
            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              break
            fi
            sleep 5
          done
          
          echo "--- STDOUT ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "--- STDERR ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query "StandardErrorContent" --output text
          
          if [[ "$STATUS" != "Success" ]]; then
            exit 1
          fi
