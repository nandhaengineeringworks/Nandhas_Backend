name: Backend CI/CD - ECR and EC2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Run Spring Boot unit / integration tests
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test Spring Boot backend
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and package
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker image, push to ECR, deploy to EC2 via SSM
  # ─────────────────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build, push to ECR, deploy to EC2
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ── Validate required secrets are present ──────────────────────────────
      - name: Validate required secrets
        env:
          S_AWS_REGION:     ${{ secrets.AWS_REGION }}
          S_ECR_REPO:       ${{ secrets.ECR_REPOSITORY }}
          S_KEY_ID:         ${{ secrets.AWS_ACCESS_KEY_ID }}
          S_SECRET:         ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S_EC2_ID:         ${{ secrets.EC2_INSTANCE_ID }}
          S_DB_HOST:        ${{ secrets.DB_HOST }}
          S_DB_USER:        ${{ secrets.DB_USERNAME }}
          S_DB_PASS:        ${{ secrets.DB_PASSWORD }}
          S_JWT:            ${{ secrets.JWT_SECRET }}
          S_S3:             ${{ secrets.AWS_S3_BUCKET }}
          S_FIREBASE:       ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${S_AWS_REGION}" ] && MISSING="${MISSING} AWS_REGION"
          [ -z "${S_ECR_REPO}"   ] && MISSING="${MISSING} ECR_REPOSITORY"
          [ -z "${S_KEY_ID}"     ] && MISSING="${MISSING} AWS_ACCESS_KEY_ID"
          [ -z "${S_SECRET}"     ] && MISSING="${MISSING} AWS_SECRET_ACCESS_KEY"
          [ -z "${S_EC2_ID}"     ] && MISSING="${MISSING} EC2_INSTANCE_ID"
          [ -z "${S_DB_HOST}"    ] && MISSING="${MISSING} DB_HOST"
          [ -z "${S_DB_USER}"    ] && MISSING="${MISSING} DB_USERNAME"
          [ -z "${S_DB_PASS}"    ] && MISSING="${MISSING} DB_PASSWORD"
          [ -z "${S_JWT}"        ] && MISSING="${MISSING} JWT_SECRET"
          [ -z "${S_S3}"         ] && MISSING="${MISSING} AWS_S3_BUCKET"
          [ -z "${S_FIREBASE}"   ] && MISSING="${MISSING} FIREBASE_SERVICE_ACCOUNT_JSON_B64"
          if [ -n "${MISSING}" ]; then
            echo "ERROR: Missing GitHub Secrets:${MISSING}"
            echo "Go to: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "All required secrets are present"

      # ── Configure AWS credentials ──────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── Login to Amazon ECR ────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build Docker image and push to ECR ────────────────────────────────
      # Tag: <commit-sha> (deterministic) + latest (for convenience)
      - name: Build and push Docker image
        id: build-image
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          REPO="${{ secrets.ECR_REPOSITORY }}"
          TAG="${{ github.sha }}"
          IMAGE_URI="${REGISTRY}/${REPO}:${TAG}"
          echo "Building: ${IMAGE_URI}"
          docker build --pull \
            -t "${IMAGE_URI}" \
            -t "${REGISTRY}/${REPO}:latest" \
            .
          docker push "${IMAGE_URI}"
          docker push "${REGISTRY}/${REPO}:latest"
          echo "image=${IMAGE_URI}"    >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "Build and push complete: ${IMAGE_URI}"

      # ── Encode the runtime .env content as base64 ─────────────────────────
      # Python is used so we never need a heredoc inside the YAML.
      - name: Encode runtime environment
        id: encode-env
        env:
          V_DB_HOST:    ${{ secrets.DB_HOST }}
          V_DB_PORT:    ${{ secrets.DB_PORT }}
          V_DB_NAME:    ${{ secrets.DB_NAME }}
          V_DB_USER:    ${{ secrets.DB_USERNAME }}
          V_DB_PASS:    ${{ secrets.DB_PASSWORD }}
          V_S3_BUCKET:      ${{ secrets.AWS_S3_BUCKET }}
          V_JWT:            ${{ secrets.JWT_SECRET }}
          V_REGION:         ${{ secrets.AWS_REGION }}
          V_ADMIN_EMAIL:    ${{ secrets.ADMIN_EMAIL }}
          V_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          V_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          V_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python3 .github/scripts/encode_env.py >> "$GITHUB_OUTPUT"
          echo "Runtime environment encoded"

      # ── Deploy to EC2 via SSM ──────────────────────────────────────────────
      # All complex logic lives in .github/scripts/ssm_deploy.py so the
      # YAML stays clean and readable with no heredoc / quoting issues.
      - name: Deploy via AWS SSM
        env:
          IMAGE_URI:        ${{ steps.build-image.outputs.image }}
          ECR_REGISTRY:     ${{ steps.build-image.outputs.registry }}
          AWS_REGION_VAL:   ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID:  ${{ secrets.EC2_INSTANCE_ID }}
          RUNTIME_ENV_B64:  ${{ steps.encode-env.outputs.env_b64 }}
          FIREBASE_B64:     ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
          GH_SHA:           ${{ github.sha }}
        run: python3 .github/scripts/ssm_deploy.py
