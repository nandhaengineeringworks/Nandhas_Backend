name: Backend CI/CD - ECR and EC2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  test:
    name: Test Spring Boot backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and package
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

  build-and-deploy:
    name: Build, push to ECR, deploy to EC2
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --pull -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare EC2 deployment command
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_JSON_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          umask 077

          RUNTIME_ENV_B64=$(cat <<EOF | base64 -w 0
          SPRING_PROFILES_ACTIVE=prod
          DB_HOST=$DB_HOST
          DB_PORT=${DB_PORT:-3306}
          DB_NAME=${DB_NAME:-nandhas_ecommerce}
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          STORAGE_TYPE=s3
          AWS_REGION=$AWS_REGION
          AWS_S3_BUCKET=$S3_BUCKET
          AWS_CLOUDFRONT_DOMAIN=$CLOUDFRONT_DOMAIN
          JWT_SECRET=$JWT_SECRET
          FIREBASE_ENABLED=true
          GOOGLE_APPLICATION_CREDENTIALS=/opt/nandhas/secrets/firebase-service-account.json
          EOF
          )

          cat > /tmp/ssm-deploy.sh <<'REMOTE_SCRIPT'
          set -euo pipefail
          IMAGE="IMAGE_PLACEHOLDER"
          REGISTRY="REGISTRY_PLACEHOLDER"
          REGION="REGION_PLACEHOLDER"
          ENV_B64="ENV_B64_PLACEHOLDER"
          FIREBASE_B64="FIREBASE_B64_PLACEHOLDER"

          sudo mkdir -p /opt/nandhas/secrets /opt/nandhas/uploads
          echo "$ENV_B64" | base64 -d | sudo tee /opt/nandhas/backend.env >/dev/null
          
          if [ -n "$FIREBASE_B64" ]; then
            echo "$FIREBASE_B64" | base64 -d | sudo tee /opt/nandhas/secrets/firebase-service-account.json >/dev/null
          else
            echo "{}" | sudo tee /opt/nandhas/secrets/firebase-service-account.json >/dev/null
          fi

          sudo chmod 755 /opt/nandhas /opt/nandhas/secrets /opt/nandhas/uploads
          sudo chmod 644 /opt/nandhas/backend.env /opt/nandhas/secrets/firebase-service-account.json
          sudo chmod -R 777 /opt/nandhas/uploads

          aws ecr get-login-password --region "$REGION" | sudo docker login --username AWS --password-stdin "$REGISTRY"
          sudo docker pull "$IMAGE"
          sudo docker rm -f nandhas-backend 2>/dev/null || true
          
          sudo docker run -d --name nandhas-backend --restart unless-stopped \
            --env-file /opt/nandhas/backend.env \
            -p 8080:8080 \
            -v /opt/nandhas/secrets:/opt/nandhas/secrets:ro \
            -v /opt/nandhas/uploads:/app/uploads \
            "$IMAGE"
          
          echo "Waiting for Spring Boot backend to initialize on port 8080..."
          HEALTHY=0
          for i in {1..25}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/products?page=0\&size=1 || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              echo "✓ Backend API is responsive (HTTP $HTTP_CODE on attempt $i)"
              HEALTHY=1
              break
            fi
            echo "Attempt $i/25: HTTP code is $HTTP_CODE. Waiting 5s..."
            sleep 5
          done

          if [ $HEALTHY -ne 1 ]; then
            echo "❌ Backend health check failed. Printing container logs:"
            sudo docker logs --tail 100 nandhas-backend
            exit 1
          fi

          sudo docker image prune -af --filter "until=168h"
          echo "✓ Backend deployment completed successfully!"
          REMOTE_SCRIPT

          REMOTE_SCRIPT=$(< /tmp/ssm-deploy.sh)
          REMOTE_SCRIPT=${REMOTE_SCRIPT//IMAGE_PLACEHOLDER/$IMAGE}
          REMOTE_SCRIPT=${REMOTE_SCRIPT//REGISTRY_PLACEHOLDER/${{ steps.ecr.outputs.registry }}}
          REMOTE_SCRIPT=${REMOTE_SCRIPT//REGION_PLACEHOLDER/$AWS_REGION}
          REMOTE_SCRIPT=${REMOTE_SCRIPT//ENV_B64_PLACEHOLDER/$RUNTIME_ENV_B64}
          REMOTE_SCRIPT=${REMOTE_SCRIPT//FIREBASE_B64_PLACEHOLDER/$FIREBASE_JSON_B64}
          printf '%s' "$REMOTE_SCRIPT" > /tmp/ssm-deploy.sh

          # Transfer the script as Base64 so SSM receives real newlines and
          # multiline secrets cannot corrupt the shell script.
          SCRIPT_B64=$(base64 -w 0 /tmp/ssm-deploy.sh)
          COMMANDS=$(jq -n --arg script "$SCRIPT_B64" '[
            "echo \($script) | base64 -d > /tmp/nandhas-deploy.sh",
            "chmod 700 /tmp/nandhas-deploy.sh",
            "bash /tmp/nandhas-deploy.sh"
          ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Nandhas backend deployment $GITHUB_SHA" \
            --parameters "commands=$COMMANDS" \
            --query 'Command.CommandId' --output text)

          echo "SSM command submitted: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
          WAIT_STATUS=$?
          set -e
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query 'Status' --output text)
          test "$STATUS" = "Success"
