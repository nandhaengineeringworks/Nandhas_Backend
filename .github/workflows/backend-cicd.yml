name: Backend CI/CD - ECR and EC2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  test:
    name: Test Spring Boot backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and package
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

  build-and-deploy:
    name: Build, push to ECR, deploy to EC2
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --pull -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare EC2 deployment command
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_JSON_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          umask 077

          # Build the env file with NO leading whitespace on any line.
          # The heredoc delimiter must be at column 0 so bash does not
          # indent the body — this is the root cause of the previous failure.
          RUNTIME_ENV_B64=$(base64 -w 0 <<EOF
SPRING_PROFILES_ACTIVE=prod
DB_HOST=$DB_HOST
DB_PORT=${DB_PORT:-3306}
DB_NAME=${DB_NAME:-nandhas_ecommerce}
DB_USERNAME=$DB_USERNAME
DB_PASSWORD=$DB_PASSWORD
STORAGE_TYPE=s3
AWS_REGION=$AWS_REGION
AWS_S3_BUCKET=$S3_BUCKET
AWS_CLOUDFRONT_DOMAIN=$CLOUDFRONT_DOMAIN
JWT_SECRET=$JWT_SECRET
FIREBASE_ENABLED=true
GOOGLE_APPLICATION_CREDENTIALS=/opt/nandhas/secrets/firebase-service-account.json
EOF
)

          # Write the remote deployment script to a temp file.
          # Single-quoted REMOTE_SCRIPT heredoc prevents the runner from
          # expanding variables that must be resolved on EC2 instead.
          cat > /tmp/ssm-deploy.sh <<'REMOTE_SCRIPT'
set -euo pipefail
IMAGE="IMAGE_PLACEHOLDER"
REGISTRY="REGISTRY_PLACEHOLDER"
REGION="REGION_PLACEHOLDER"
ENV_B64="ENV_B64_PLACEHOLDER"
FIREBASE_B64="FIREBASE_B64_PLACEHOLDER"

# Create directories
sudo mkdir -p /opt/nandhas/secrets /opt/nandhas/uploads

# Write env file – decode from base64 so no secrets appear in process list
echo "$ENV_B64" | base64 -d | sudo tee /opt/nandhas/backend.env >/dev/null

# Write Firebase service account JSON
if [ -n "$FIREBASE_B64" ]; then
  echo "$FIREBASE_B64" | base64 -d | sudo tee /opt/nandhas/secrets/firebase-service-account.json >/dev/null
else
  echo "{}" | sudo tee /opt/nandhas/secrets/firebase-service-account.json >/dev/null
fi

# Permissions: files readable by all (container runs as non-root appuser)
sudo chmod 755 /opt/nandhas /opt/nandhas/secrets /opt/nandhas/uploads
sudo chmod 644 /opt/nandhas/backend.env /opt/nandhas/secrets/firebase-service-account.json
sudo chmod -R 777 /opt/nandhas/uploads

# Authenticate to ECR and pull the new image
aws ecr get-login-password --region "$REGION" | sudo docker login --username AWS --password-stdin "$REGISTRY"
sudo docker pull "$IMAGE"

# Stop and remove the old container if running
sudo docker rm -f nandhas-backend 2>/dev/null || true

# Start the new container
CONTAINER_ID=$(sudo docker run -d --name nandhas-backend --restart unless-stopped \
  --env-file /opt/nandhas/backend.env \
  -p 8080:8080 \
  -v /opt/nandhas/secrets:/opt/nandhas/secrets:ro \
  -v /opt/nandhas/uploads:/app/uploads \
  "$IMAGE")

echo "Container started: $CONTAINER_ID"

# Brief pause – if the JVM crashes at startup it will have exited by now
sleep 10

if ! sudo docker ps --format '{{.Names}}' | grep -q 'nandhas-backend'; then
  echo "❌ Container exited immediately after start."
  echo "--- Container state ---"
  sudo docker inspect nandhas-backend \
    --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' 2>/dev/null || true
  echo "--- All containers ---"
  sudo docker ps -a
  echo "--- Container logs (last 200 lines) ---"
  sudo docker logs --tail 200 "$CONTAINER_ID" 2>&1 || true
  exit 1
fi

echo "Container is running. Waiting for Spring Boot to accept HTTP traffic on port 8080..."
HEALTHY=0
for i in $(seq 1 25); do
  HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080/api/products?page=0&size=1" || echo "000")
  if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
    echo "✓ Backend API is responsive (HTTP $HTTP_CODE on attempt $i)"
    HEALTHY=1
    break
  fi
  echo "Attempt $i/25: HTTP $HTTP_CODE – waiting 5s..."
  sleep 5
done

if [ "$HEALTHY" -ne 1 ]; then
  echo "❌ Backend health check failed after 25 attempts."
  echo "--- Container state ---"
  sudo docker inspect nandhas-backend \
    --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' 2>/dev/null || true
  echo "--- Container logs (last 200 lines) ---"
  sudo docker logs --tail 200 nandhas-backend 2>&1 || true
  exit 1
fi

sudo docker image prune -af --filter "until=168h"
echo "✓ Backend deployment completed successfully!"
REMOTE_SCRIPT

          # Replace placeholders with real values
          REMOTE_SCRIPT_CONTENT=$(< /tmp/ssm-deploy.sh)
          REMOTE_SCRIPT_CONTENT=${REMOTE_SCRIPT_CONTENT//IMAGE_PLACEHOLDER/$IMAGE}
          REMOTE_SCRIPT_CONTENT=${REMOTE_SCRIPT_CONTENT//REGISTRY_PLACEHOLDER/${{ steps.ecr.outputs.registry }}}
          REMOTE_SCRIPT_CONTENT=${REMOTE_SCRIPT_CONTENT//REGION_PLACEHOLDER/$AWS_REGION}
          REMOTE_SCRIPT_CONTENT=${REMOTE_SCRIPT_CONTENT//ENV_B64_PLACEHOLDER/$RUNTIME_ENV_B64}
          REMOTE_SCRIPT_CONTENT=${REMOTE_SCRIPT_CONTENT//FIREBASE_B64_PLACEHOLDER/$FIREBASE_JSON_B64}
          printf '%s' "$REMOTE_SCRIPT_CONTENT" > /tmp/ssm-deploy.sh

          # Encode the final script as Base64 so SSM receives exact bytes
          # (avoids shell quoting issues with secrets inside the script body)
          SCRIPT_B64=$(base64 -w 0 /tmp/ssm-deploy.sh)
          COMMANDS=$(jq -n --arg script "$SCRIPT_B64" '[
            "echo \($script) | base64 -d > /tmp/nandhas-deploy.sh",
            "chmod 700 /tmp/nandhas-deploy.sh",
            "bash /tmp/nandhas-deploy.sh"
          ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Nandhas backend deployment $GITHUB_SHA" \
            --parameters "commands=$COMMANDS" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)

          echo "SSM command submitted: $COMMAND_ID"
          
          set +e
          MAX_WAIT=600
          INTERVAL=15
          ELAPSED=0
          STATUS="InProgress"

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            
            echo "[$ELAPSED s] SSM Status: $STATUS"
            
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              break
            fi
            
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          test "$STATUS" = "Success"
