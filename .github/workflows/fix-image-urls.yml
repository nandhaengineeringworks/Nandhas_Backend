name: Fix Image URLs in DB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-urls:
    name: Fix localhost URLs in Database
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Run SQL UPDATE on EC2 via SSM + Docker
        run: |
          set -euo pipefail

          DB_HOST="${{ secrets.DB_HOST }}"
          DB_PORT="${{ secrets.DB_PORT }}"
          DB_USERNAME="${{ secrets.DB_USERNAME }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          DB_NAME="${{ secrets.DB_NAME }}"
          EC2_INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          # SQL to replace localhost URLs with api.nandhas.in
          SQL="
          UPDATE products SET primary_image_url = REPLACE(primary_image_url, 'http://localhost:8080', 'https://api.nandhas.in') WHERE primary_image_url LIKE '%localhost%';
          UPDATE product_images SET image_url = REPLACE(image_url, 'http://localhost:8080', 'https://api.nandhas.in') WHERE image_url LIKE '%localhost%';
          UPDATE banners SET image_url = REPLACE(image_url, 'http://localhost:8080', 'https://api.nandhas.in') WHERE image_url LIKE '%localhost%';
          SELECT COUNT(*) as products_updated FROM products WHERE primary_image_url LIKE '%localhost%';
          SELECT COUNT(*) as product_images_updated FROM product_images WHERE image_url LIKE '%localhost%';
          SELECT COUNT(*) as banners_updated FROM banners WHERE image_url LIKE '%localhost%';
          "

          SQL_B64=$(echo "$SQL" | base64 -w 0)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[
              \"printf '%s' ${SQL_B64} | base64 -d > /tmp/fix-urls.sql\",
              \"docker run --rm -v /tmp/fix-urls.sql:/tmp/fix-urls.sql:ro mysql:8 sh -c \\\"mysql -h '${DB_HOST}' -P '${DB_PORT}' -u '${DB_USERNAME}' -p'${DB_PASSWORD}' '${DB_NAME}' < /tmp/fix-urls.sql\\\"\"
            ]}" \
            --timeout-seconds 120 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId: ${COMMAND_ID}"

          for i in $(seq 1 20); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "  [${i}] Status: ${STATUS}"
            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "====== STDOUT ======"
              aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${EC2_INSTANCE_ID}" --query "StandardOutputContent" --output text || true
              echo "====== STDERR ======"
              aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${EC2_INSTANCE_ID}" --query "StandardErrorContent" --output text || true
              if [ "$STATUS" != "Success" ]; then exit 1; fi
              exit 0
            fi
          done
          echo "Timed out."; exit 1
