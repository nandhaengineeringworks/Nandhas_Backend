name: Upload Images to EC2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-images:
    name: Upload local images to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Create archive and upload to S3 with Presigned URL
        id: presign
        run: |
          echo "Packaging uploads directory..."
          tar -czf /tmp/uploads.tar.gz -C backend-api uploads
          echo "Uploading archive to S3..."
          aws s3 cp /tmp/uploads.tar.gz s3://${{ secrets.AWS_S3_BUCKET }}/uploads.tar.gz
          echo "Generating presigned URL..."
          PRESIGNED_URL=$(aws s3 presign s3://${{ secrets.AWS_S3_BUCKET }}/uploads.tar.gz --expires-in 3600)
          echo "presigned_url=${PRESIGNED_URL}" >> $GITHUB_OUTPUT
          echo "Archive uploaded and presigned URL generated."

      - name: Download and extract on EC2 via SSM
        run: |
          set -euo pipefail

          PRESIGNED_URL="${{ steps.presign.outputs.presigned_url }}"
          EC2_INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          # Write remote script
          cat > /tmp/sync_images.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          echo "=== Downloading uploads.tar.gz via Presigned URL ==="
          curl -fSL "${1}" -o /tmp/uploads.tar.gz
          echo "=== Extracting to /opt/nandhas/ ==="
          mkdir -p /opt/nandhas
          tar -xzf /tmp/uploads.tar.gz -C /opt/nandhas/
          chmod -R 777 /opt/nandhas/uploads/
          rm -f /tmp/uploads.tar.gz
          echo "=== Files extracted successfully ==="
          ls -la /opt/nandhas/uploads/products/ /opt/nandhas/uploads/banners/
          EOF

          SCRIPT_B64=$(base64 -w 0 /tmp/sync_images.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[
              \"printf '%s' ${SCRIPT_B64} | base64 -d > /tmp/nandhas-sync-images.sh\",
              \"chmod 700 /tmp/nandhas-sync-images.sh\",
              \"bash /tmp/nandhas-sync-images.sh '${PRESIGNED_URL}'\"
            ]}" \
            --timeout-seconds 120 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId: ${COMMAND_ID}"

          for i in $(seq 1 30); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "  [${i}] Status: ${STATUS}"
            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "====== STDOUT ======"
              aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${EC2_INSTANCE_ID}" --query "StandardOutputContent" --output text || true
              echo "====== STDERR ======"
              aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${EC2_INSTANCE_ID}" --query "StandardErrorContent" --output text || true
              if [ "$STATUS" != "Success" ]; then exit 1; fi
              exit 0
            fi
          done
          echo "Timed out."; exit 1
