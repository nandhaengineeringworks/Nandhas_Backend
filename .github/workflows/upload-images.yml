name: Upload Images to EC2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-images:
    name: Upload local images to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Upload images to S3
        run: |
          echo "Uploading uploads folder to S3..."
          aws s3 sync backend-api/uploads/ s3://${{ secrets.AWS_S3_BUCKET }}/uploads/
          echo "Upload complete."

      - name: Sync images from S3 to EC2 via SSM
        run: |
          set -euo pipefail

          S3_BUCKET="${{ secrets.AWS_S3_BUCKET }}"
          EC2_INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[
              \"mkdir -p /opt/nandhas/uploads/products /opt/nandhas/uploads/banners\",
              \"aws s3 sync s3://${S3_BUCKET}/uploads/ /opt/nandhas/uploads/ --region ${{ secrets.AWS_REGION }}\",
              \"ls -la /opt/nandhas/uploads/products/ /opt/nandhas/uploads/banners/\"
            ]}" \
            --timeout-seconds 120 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId: ${COMMAND_ID}"

          for i in $(seq 1 20); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "  [${i}] Status: ${STATUS}"
            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "====== STDOUT ======"
              aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${EC2_INSTANCE_ID}" --query "StandardOutputContent" --output text || true
              echo "====== STDERR ======"
              aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${EC2_INSTANCE_ID}" --query "StandardErrorContent" --output text || true
              if [ "$STATUS" != "Success" ]; then exit 1; fi
              exit 0
            fi
          done
          echo "Timed out."; exit 1
